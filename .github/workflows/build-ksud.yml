name: Build DaFeiYu ksud

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build ksud (aarch64)
        env:
          KSU_PACKAGE_NAME: com.dfyking
        run: |
          cd userspace/ksud
          cargo ndk -t arm64-v8a build --release
          cp target/aarch64-linux-android/release/ksud /tmp/libksud.so
          ls -lh /tmp/libksud.so

      - name: Upload libksud.so
        uses: actions/upload-artifact@v4
        with:
          name: libksud-com.dfyking
          path: /tmp/libksud.so
